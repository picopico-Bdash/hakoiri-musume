<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>箱入り娘</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 全画面共通でタイトル絵をぼかした背景＋舞う桜。上に漆塗り×金縁のパネルを重ねる和風の単一ダーク配色 */
:root{
  --ink:#1A0C0F;           /* 漆の黒 */
  --lacquer:#2A1216;       /* パネル地 */
  --panel:rgba(34,14,19,.78);
  --crimson:#8E1A36; --crimson-dk:#5E0F22;
  --gold:#D9B56B; --gold-hi:#F4DDA2; --gold-dim:rgba(217,181,107,.45);
  --fg:#FFF3DF; --muted:#D7BFA6; --sakura:#F7C2D0;
  --frame:#1C0E10; --slot:#140A0B;
  --wood:#EBD3A6; --wood-dk:#D1B07A; --wood-ink:#3B2817;
  --musume:#B0213F; --musume-dk:#7A1027; --musume-ink:#FFF3DF;
  --hint:#F2CF7E;
  --d1:#A9C98A; --d2:#E9B949; --d3:#F29A9A; --d4:#C7ACEB;
  --f-display:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho",serif;
  --f-ui:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{background:var(--ink);color:var(--fg)}
body{font-family:var(--f-ui);padding-inline:16px;padding-block:24px 40px;min-height:100%;box-sizing:border-box}
.backdrop{position:fixed;inset:0;background:url(assets/title.jpg) center/cover;filter:blur(26px) brightness(.42) saturate(1.15);
  transform:scale(1.15);z-index:0;pointer-events:none}
#petals{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:0}
html[data-screen="title"] #petals{z-index:2}
.petal{position:absolute;top:-5%;width:12px;height:10px;border-radius:70% 0 70% 0;background:var(--sakura);opacity:.85;
  animation:fall linear infinite}
@keyframes fall{to{transform:translate(var(--dx),115vh) rotate(540deg)}}
.screen{position:relative;z-index:1;max-width:880px;margin:0 auto}
.screen[hidden]{display:none!important}
button{font:inherit}

/* 見出し：金の飾り線つき明朝 */
.heading{font-family:var(--f-display);font-weight:800;margin:0;letter-spacing:.14em;color:var(--fg);
  display:flex;align-items:center;gap:14px;text-shadow:0 2px 6px rgba(0,0,0,.6)}
.heading::before,.heading::after{content:"";height:1px;flex:1 1 24px;min-width:16px;
  background:linear-gradient(90deg,transparent,var(--gold))}
.heading::after{background:linear-gradient(90deg,var(--gold),transparent)}
.crest{width:1.1em;height:1.1em;flex:none;color:var(--gold)}

/* 漆のパネル */
.lacq{background:var(--panel);border:1px solid var(--gold-dim);border-radius:10px;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.25),0 8px 24px rgba(0,0,0,.35);backdrop-filter:blur(6px)}

/* ボタン：はじめるボタンに合わせた紅×金縁 */
.btn{font-family:var(--f-display);font-weight:800;font-size:.95rem;letter-spacing:.1em;padding:10px 18px;cursor:pointer;
  color:var(--fg);border:1.5px solid var(--gold);border-radius:4px;
  background:linear-gradient(180deg,var(--crimson),var(--crimson-dk));
  box-shadow:inset 0 0 0 2px var(--crimson-dk),inset 0 0 0 3px var(--gold-dim),0 3px 8px rgba(0,0,0,.4);
  transition:filter .15s ease,transform .1s ease}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(1px)}
.btn.sub{background:linear-gradient(180deg,#3A1B20,#24100F)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn:focus-visible,.card:focus-visible,.piece:focus-visible,.link:focus-visible,.t-start:focus-visible{outline:3px solid var(--hint);outline-offset:3px}
.link{background:none;border:0;color:var(--muted);cursor:pointer;padding:6px 0;font-size:.9rem;font-family:var(--f-display);letter-spacing:.08em}
.link:hover{color:var(--gold-hi)}

/* ---------- 盤面：黒漆の木枠に金縁 ---------- */
.frame{position:relative;width:min(100%,380px);padding:14px 14px 18px;border-radius:12px;
  background:linear-gradient(160deg,#3A1A1E,var(--frame) 55%);
  border:2px solid var(--gold);
  box-shadow:inset 0 0 0 4px var(--frame),inset 0 0 0 5px var(--gold-dim),0 14px 34px rgba(0,0,0,.55)}
.board{position:relative;width:100%;aspect-ratio:4/5;background:var(--slot);border-radius:4px;
  box-shadow:inset 0 3px 10px rgba(0,0,0,.7);touch-action:none;
  background-image:radial-gradient(circle at 50% 120%,rgba(247,194,208,.06),transparent 60%)}
.exit{position:absolute;left:calc(14px + (100% - 28px)*.25);width:calc((100% - 28px)*.5);bottom:-2px;height:20px;
  background:var(--slot);display:flex;align-items:center;justify-content:center;border-inline:1px solid var(--gold-dim)}
.exit span{font-size:.62rem;letter-spacing:.3em;color:var(--gold);font-family:var(--f-display)}
.piece{position:absolute;padding:0;border:0;background:none;cursor:grab;touch-action:none;
  transition:left .12s ease,top .12s ease}
.piece.dragging{cursor:grabbing;transition:none;z-index:3}
.piece .face{position:absolute;inset:3px;border-radius:5px;display:flex;align-items:center;justify-content:center;
  font-family:var(--f-display);font-weight:800;color:var(--wood-ink);font-size:clamp(1rem,5.2vw,1.55rem);
  background:
    repeating-linear-gradient(92deg,rgba(120,80,30,.07) 0 2px,transparent 2px 9px),
    linear-gradient(170deg,var(--wood),var(--wood-dk));
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45), inset 0 -3px 0 rgba(0,0,0,.18), 0 2px 4px rgba(0,0,0,.55)}
.piece.V .face{writing-mode:vertical-rl;letter-spacing:.2em}
.piece.H .face{letter-spacing:.25em}
.piece.M .face{color:var(--musume-ink);font-size:clamp(1.6rem,9vw,2.6rem);letter-spacing:.1em;
  text-shadow:0 2px 4px rgba(0,0,0,.4);
  background:
    radial-gradient(circle at 78% 22%,rgba(247,194,208,.35) 0 6%,transparent 7%),
    radial-gradient(circle at 18% 80%,rgba(247,194,208,.25) 0 5%,transparent 6%),
    radial-gradient(circle at 30% 25%,rgba(255,255,255,.16),transparent 55%),
    linear-gradient(165deg,var(--musume),var(--musume-dk));
  box-shadow:inset 0 0 0 2px var(--musume-dk),inset 0 0 0 3px var(--gold),0 2px 5px rgba(0,0,0,.6)}
.piece.sel .face{outline:3px solid var(--hint);outline-offset:-1px}
.piece.hinted .face{animation:pulse .8s ease-in-out 3}
@keyframes pulse{50%{filter:brightness(1.2)}}
.ghost{position:absolute;pointer-events:none;border:2.5px dashed var(--hint);border-radius:6px;
  margin:3px;box-sizing:border-box;background:rgba(242,207,126,.14)}
.piece.out{transition:top .7s cubic-bezier(.5,0,.7,.4),opacity .7s .2s;opacity:0}

/* ---------- タイトル ---------- */
html[data-screen="title"] body{padding-block:16px}
#title{max-width:none;display:flex;justify-content:center;cursor:pointer;user-select:none}
.t-card{position:relative;width:min(100%, calc((100dvh - 32px) * 768 / 1377), 520px);aspect-ratio:768/1377;
  border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.55)}
.t-card > img.t-art{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;max-width:none}
.t-start{position:absolute;left:50%;bottom:6%;transform:translateX(-50%);width:82%;display:flex;flex-direction:column;align-items:center;gap:6px;
  padding:0;border:0;background:none;cursor:pointer;z-index:3}
.t-start img{width:100%;display:block;filter:drop-shadow(0 6px 10px rgba(0,0,0,.45));animation:breathe 2.4s ease-in-out infinite;
  transition:transform .15s ease}
.t-start:hover img{transform:scale(1.03)}
.t-start:active img{transform:scale(.97)}
@keyframes breathe{50%{filter:drop-shadow(0 6px 10px rgba(0,0,0,.45)) drop-shadow(0 0 14px rgba(255,214,150,.65))}}
.t-hint{margin:0;font-family:var(--f-display);font-size:clamp(.72rem,2.6vw,.9rem);letter-spacing:.12em;color:var(--fg);
  text-shadow:0 1px 3px rgba(0,0,0,.8),0 0 8px rgba(0,0,0,.6)}
kbd{font-family:var(--f-ui);font-size:.85em;border:1px solid var(--gold-dim);border-radius:4px;padding:0 6px;background:rgba(0,0,0,.3);color:var(--fg)}

/* ---------- 難易度選択 ---------- */
#select{display:flex;flex-direction:column;gap:18px}
.s-top{display:flex;justify-content:space-between;align-items:center}
.logo{height:clamp(110px,30vw,170px);width:auto;max-width:100%;display:block;margin:0 auto;filter:drop-shadow(0 4px 10px rgba(0,0,0,.5))}
#select .heading{font-size:1.5rem}
.lead{margin:0;text-align:center;color:var(--muted);font-size:.9rem;font-family:var(--f-display);letter-spacing:.06em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.card{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;text-align:left;
  padding:14px 16px;color:var(--fg);cursor:pointer;transition:transform .12s ease,border-color .12s ease,background .12s ease}
.card:hover{transform:translateY(-2px);border-color:var(--gold);background:rgba(60,20,30,.82)}
.mini{grid-row:1 / span 3;width:52px;aspect-ratio:4/5;background:var(--slot);border-radius:3px;position:relative;
  box-shadow:0 0 0 3px var(--frame),0 0 0 4px var(--gold)}
.mini i{position:absolute;border-radius:2px;background:var(--wood);box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
.mini i.M{background:var(--musume)}
.lvtag{font-family:var(--f-display);font-size:.74rem;font-weight:800;letter-spacing:.16em;justify-self:start;padding:1px 10px;
  border:1px solid currentColor;border-radius:2px;background:rgba(0,0,0,.25)}
.lvtag.d1{color:var(--d1)}.lvtag.d2{color:var(--d2)}.lvtag.d3{color:var(--d3)}.lvtag.d4{color:var(--d4)}
.card b{font-family:var(--f-display);font-size:1.25rem;letter-spacing:.08em}
.card .meta{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:12px;flex-wrap:wrap}
.card .meta .ok{color:var(--gold-hi);font-weight:700}

/* ---------- 対局 ---------- */
#game{display:flex;flex-direction:column;gap:18px}
.g-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.g-head h2{margin:0;font-family:var(--f-display);font-size:1.5rem;letter-spacing:.12em;display:flex;align-items:center;gap:10px;
  text-shadow:0 2px 6px rgba(0,0,0,.6)}
.main{display:flex;gap:28px;align-items:flex-start;flex-wrap:wrap}
.stage{flex:1 1 320px;min-width:0;display:flex;justify-content:center}
.panel{flex:1 1 240px;min-width:0;display:flex;flex-direction:column;gap:16px;padding:18px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{border:1px solid var(--gold-dim);border-radius:6px;padding:10px 14px;background:rgba(0,0,0,.25);text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:2rem;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--gold-hi)}
.stat small{color:var(--muted);font-size:.78rem;letter-spacing:.14em;font-family:var(--f-display)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.msg{min-height:1.4em;font-size:.92rem;color:var(--gold-hi);margin:0}
.rules{font-size:.85rem;color:var(--muted);line-height:1.8;margin:0;border-top:1px solid var(--gold-dim);padding-top:14px}
.rules strong{color:var(--fg);font-family:var(--f-display)}

/* ---------- クリア ---------- */
#clear{display:flex;justify-content:center;padding-block:min(5vh,40px) 24px}
.c-box{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center;width:min(100%,480px);padding:32px 22px 26px}
.c-kicker{margin:0;font-size:.9rem;color:var(--muted);letter-spacing:.24em;font-family:var(--f-display)}
.c-title{margin:0;font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,12vw,4rem);letter-spacing:.16em;
  background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,#A9813A);-webkit-background-clip:text;background-clip:text;color:transparent;
  animation:rise .7s ease-out both}
@keyframes rise{from{transform:translateY(14px) scale(.96);opacity:.1}}
.c-scores{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.c-scores .stat b{font-size:2.6rem}
.c-scores .stat b span{font-size:1rem;margin-left:2px;color:var(--muted)}
.c-rank{margin:0;font-size:1.1rem;font-weight:800;font-family:var(--f-display);letter-spacing:.06em}
.c-note{margin:0;color:var(--muted);font-size:.9rem}
.c-press{margin:0;font-size:.85rem;color:var(--muted)}

@media (prefers-reduced-motion:reduce){
  .piece,.piece.out,.card,.btn{transition:none}.piece.hinted .face,.c-title,.t-start img,.petal{animation:none}
}
</style>

<script id="core">
const COLS = 4, ROWS = 5;
// best は solve() で検証済みの最短手数
const LEVELS = [
  { name: "手ならし", diff: 1, best: 10, rows: ["AcdB","AMMB","CMMD","CefD","g..h"] },
  { name: "小手調べ", diff: 1, best: 13, rows: ["cHHd","AMMB","AMMB","CefD","C..D"] },
  { name: "片寄せ",   diff: 2, best: 28, rows: ["AMMc","AMMd","BHHe","BIIf","g..h"] },
  { name: "横一文字", diff: 2, best: 40, rows: ["AMMB","AMMB","cdef","HHII","g..h"] },
  { name: "寄り道",   diff: 3, best: 73, rows: ["MMAB","MMAB","CDHH","CDef","g..h"] },
  { name: "箱入り娘", diff: 4, best: 81, rows: ["AMMB","AMMB","CHHD","CefD","g..h"] },
];
const DIFF = { 1:"初級", 2:"中級", 3:"上級", 4:"達人" };
const LABELS = { M:["娘"], V:["父","母","祖父","祖母"], H:["番頭","手代"], S:["丁稚","女中","小僧","下男"] };
function kindOf(p){ return p.w===2&&p.h===2?"M":p.w===1&&p.h===2?"V":p.w===2&&p.h===1?"H":"S"; }
function parseLevel(rows){
  const seen = {}, ps = [], cnt = {M:0,V:0,H:0,S:0};
  for (let r=0;r<ROWS;r++) for (let c=0;c<COLS;c++){
    const ch = rows[r][c];
    if (ch === "." || seen[ch]) continue;
    seen[ch] = 1;
    let w=1; while (c+w<COLS && rows[r][c+w]===ch) w++;
    let h=1; while (r+h<ROWS && rows[r+h][c]===ch) h++;
    const p = { id: ch, r, c, w, h };
    p.kind = kindOf(p);
    const L = LABELS[p.kind]; p.label = L[cnt[p.kind]++ % L.length];
    ps.push(p);
  }
  return ps;
}
const isWin = ps => ps.some(p => p.kind==="M" && p.r===3 && p.c===1);
function keyOf(ps, pos){
  const g = new Array(20).fill(".");
  ps.forEach((p,i)=>{ const [r,c]=pos[i]; for(let y=0;y<p.h;y++)for(let x=0;x<p.w;x++) g[(r+y)*4+c+x]="#"; });
  ps.forEach((p,i)=>{ const [r,c]=pos[i]; g[r*4+c]=p.kind; });
  return g.join("");
}
// 1手 = 1つの駒を任意の経路で動かすこと。最短手順を BFS で求める
function solve(ps){
  const start = ps.map(p=>[p.r,p.c]);
  const win = pos => ps.some((p,i)=>p.kind==="M"&&pos[i][0]===3&&pos[i][1]===1);
  if (win(start)) return [];
  const k0 = keyOf(ps,start), prev = new Map([[k0,null]]);
  let frontier = [start];
  while (frontier.length){
    const next = [];
    for (const pos of frontier){
      const k = keyOf(ps,pos);
      const occ = new Int8Array(20).fill(-1);
      ps.forEach((p,i)=>{ const [r,c]=pos[i]; for(let y=0;y<p.h;y++)for(let x=0;x<p.w;x++) occ[(r+y)*4+c+x]=i; });
      for (let i=0;i<ps.length;i++){
        const p = ps[i], fits = (r,c)=>{
          if (r<0||c<0||r+p.h>ROWS||c+p.w>COLS) return false;
          for(let y=0;y<p.h;y++)for(let x=0;x<p.w;x++){ const o=occ[(r+y)*4+c+x]; if(o!==-1&&o!==i) return false; }
          return true;
        };
        const seen = new Set([pos[i][0]*4+pos[i][1]]), q=[pos[i]];
        while (q.length){
          const [r,c] = q.shift();
          for (const [dr,dc] of [[1,0],[-1,0],[0,1],[0,-1]]){
            const nr=r+dr, nc=c+dc, id=nr*4+nc;
            if (seen.has(id) || !fits(nr,nc)) continue;
            seen.add(id); q.push([nr,nc]);
            const np = pos.slice(); np[i]=[nr,nc];
            const nk = keyOf(ps,np);
            if (prev.has(nk)) continue;
            prev.set(nk,{k,i,r:nr,c:nc});
            if (win(np)){
              const path=[]; let cur=nk;
              while (prev.get(cur)){ const e=prev.get(cur); path.unshift({i:e.i,r:e.r,c:e.c}); cur=e.k; }
              return path;
            }
            next.push(np);
          }
        }
      }
    }
    frontier = next;
  }
  return null;
}
if (typeof module !== "undefined") module.exports = { LEVELS, parseLevel, solve };
</script>

<script>
(function(){
const $ = id => document.getElementById(id);
const board = $("board");
const SCREENS = ["title","select","game","clear"];
let screen = "title";
let levelIdx = 0, pieces = [], moves = 0, lastId = null, history = [], selected = null, won = false;
let cleared = {};
try { cleared = JSON.parse(localStorage.getItem("hakoiri-cleared") || "{}"); } catch(e){}
const saveCleared = () => { try { localStorage.setItem("hakoiri-cleared", JSON.stringify(cleared)); } catch(e){} };

function show(name, focusId){
  screen = name;
  document.documentElement.dataset.screen = name;
  SCREENS.forEach(s => $(s).hidden = s !== name);
  window.scrollTo(0,0);
  if (focusId) requestAnimationFrame(()=>$(focusId)?.focus());
}

/* ---------- 共通：駒の配置 ---------- */
function place(el, p){
  el.style.left = p.c*25+"%"; el.style.top = p.r*20+"%";
  el.style.width = p.w*25+"%"; el.style.height = p.h*20+"%";
}
function pieceEl(p, interactive){
  const el = document.createElement(interactive ? "button" : "div");
  el.className = "piece "+p.kind; el.dataset.id = p.id;
  if (interactive){ el.id = "pc-"+p.id; el.setAttribute("aria-label", p.label); }
  el.innerHTML = `<span class="face">${p.label}</span>`;
  place(el,p);
  return el;
}

/* ---------- タイトル ---------- */
const petals = $("petals");
if (!matchMedia("(prefers-reduced-motion: reduce)").matches){
  for (let i=0;i<14;i++){
    const d = document.createElement("i"); d.className = "petal";
    d.style.left = (Math.random()*100)+"%";
    d.style.setProperty("--dx", (Math.random()*120-40)+"px");
    d.style.animationDuration = (7+Math.random()*7)+"s";
    d.style.animationDelay = (-Math.random()*14)+"s";
    d.style.transform = `scale(${.6+Math.random()*.7})`;
    petals.appendChild(d);
  }
}
$("title").addEventListener("click", () => goSelect());

/* ---------- 難易度選択 ---------- */
function renderCards(){
  const box = $("cards"); box.innerHTML = "";
  LEVELS.forEach((lv,i)=>{
    const b = document.createElement("button");
    b.className = "card lacq"; b.id = "card"+i;
    const mini = parseLevel(lv.rows).map(p =>
      `<i class="${p.kind==="M"?"M":""}" style="left:calc(${p.c*25}% + 1px);top:calc(${p.r*20}% + 1px);width:calc(${p.w*25}% - 2px);height:calc(${p.h*20}% - 2px)"></i>`).join("");
    const rec = cleared[i] ? `<span class="ok">記録 ${cleared[i]}手${cleared[i]<=lv.best?" ★":""}</span>` : `<span>未クリア</span>`;
    b.innerHTML = `<span class="mini" aria-hidden="true">${mini}</span>
      <span class="lvtag d${lv.diff}">${DIFF[lv.diff]}</span>
      <b>${lv.name}</b>
      <span class="meta"><span>最短 ${lv.best}手</span>${rec}</span>`;
    b.onclick = () => startLevel(i);
    box.appendChild(b);
  });
}
function goSelect(){
  renderCards();
  show("select", "card"+Math.min(levelIdx, LEVELS.length-1));
}
$("toTitle").onclick = () => show("title");
$("toSelect").onclick = () => goSelect();

/* ---------- 対局 ---------- */
function render(){
  board.querySelectorAll(".piece").forEach(el=>{
    const p = pieces.find(q=>q.id===el.dataset.id);
    place(el,p);
    el.classList.toggle("sel", selected===p.id);
  });
  $("moves").textContent = moves;
  $("undoBtn").disabled = !history.length || won;
}
function startLevel(i, state){
  levelIdx = i; won = false; selected = null; lastId = null;
  pieces = parseLevel(LEVELS[i].rows); moves = 0; history = [];
  if (state){ state.pos.forEach((rc,k)=>{ pieces[k].r=rc[0]; pieces[k].c=rc[1]; }); moves = state.moves; }
  const lv = LEVELS[i];
  $("gTag").className = "lvtag d"+lv.diff; $("gTag").textContent = DIFF[lv.diff];
  $("gName").textContent = lv.name;
  $("best").textContent = lv.best;
  $("msg").textContent = "";
  board.innerHTML = "";
  pieces.forEach(p => { const el = pieceEl(p,true); attachDrag(el,p); board.appendChild(el); });
  clearHint(); render();
  show("game");
}
function occupied(r,c,except){
  return pieces.some(p=>p!==except && r>=p.r && r<p.r+p.h && c>=p.c && c<p.c+p.w);
}
function canMove(p,dr,dc){
  const nr=p.r+dr, nc=p.c+dc;
  if (nr<0||nc<0||nr+p.h>ROWS||nc+p.w>COLS) return false;
  for(let y=0;y<p.h;y++)for(let x=0;x<p.w;x++) if (occupied(nr+y,nc+x,p)) return false;
  return true;
}
function step(p,dr,dc){
  if (won || !canMove(p,dr,dc)) return false;
  if (lastId !== p.id){ history.push(pieces.map(q=>[q.r,q.c])); moves++; lastId = p.id; }
  p.r += dr; p.c += dc;
  $("msg").textContent = "";
  clearHint(); render();
  if (isWin(pieces)) finish();
  return true;
}
function finish(){
  won = true; selected = null; render();
  const lv = LEVELS[levelIdx];
  const isNew = !cleared[levelIdx] || moves < cleared[levelIdx];
  if (isNew){ cleared[levelIdx] = moves; saveCleared(); }
  const m = pieces.find(p=>p.kind==="M"), el = $("pc-"+m.id);
  requestAnimationFrame(()=>{ el.classList.add("out"); el.style.top = "100%"; });
  setTimeout(()=>showClear(moves, lv, isNew), 900);
}
function showClear(mv, lv, isNew){
  $("cLevel").textContent = `${DIFF[lv.diff]}　${lv.name}`;
  $("cMoves").innerHTML = `${mv}<span>手</span>`;
  $("cBest").innerHTML = `${lv.best}<span>手</span>`;
  const diff = mv - lv.best;
  $("cRank").textContent = diff <= 0 ? "最短手数でクリア。お見事です。"
    : diff <= Math.ceil(lv.best*0.2) ? `最短まであと${diff}手。かなり惜しいです。`
    : `最短より${diff}手多くかかりました。`;
  $("cNote").textContent = isNew && mv > 0 ? "自己ベストを記録しました。" : `自己ベストは${cleared[levelIdx]}手です。`;
  show("clear", "clearBtn");
}
$("clearBtn").onclick = () => goSelect();

function attachDrag(el,p){
  let sx, sy, dragging=false, movedAny=false;
  el.addEventListener("pointerdown", e=>{
    if (won) return;
    dragging = true; movedAny = false; sx = e.clientX; sy = e.clientY;
    el.setPointerCapture(e.pointerId); el.classList.add("dragging");
  });
  el.addEventListener("pointermove", e=>{
    if (!dragging) return;
    const cw = board.clientWidth/COLS, ch = board.clientHeight/ROWS;
    let guard = 8;
    while (guard--){
      const dx = (e.clientX-sx)/cw, dy = (e.clientY-sy)/ch;
      const ax = Math.abs(dx), ay = Math.abs(dy);
      const tryX = () => ax>.5 && step(p,0,Math.sign(dx)) && (sx += Math.sign(dx)*cw, true);
      const tryY = () => ay>.5 && step(p,Math.sign(dy),0) && (sy += Math.sign(dy)*ch, true);
      const did = ax>=ay ? (tryX() || tryY()) : (tryY() || tryX());
      if (!did) break;
      movedAny = true;
    }
  });
  const end = () => {
    if (!dragging) return;
    dragging = false; el.classList.remove("dragging");
    if (!movedAny && !won){ selected = selected===p.id ? null : p.id; render(); }
  };
  el.addEventListener("pointerup", end);
  el.addEventListener("pointercancel", end);
  el.addEventListener("focus", ()=>{ if(!won){ selected = p.id; render(); } });
}

$("undoBtn").onclick = () => {
  if (!history.length || won) return;
  const s = history.pop(); s.forEach((rc,k)=>{ pieces[k].r=rc[0]; pieces[k].c=rc[1]; });
  moves--; lastId = null; clearHint(); render();
};
$("resetBtn").onclick = () => startLevel(levelIdx);

let hintTimer;
function clearHint(){
  board.querySelectorAll(".ghost").forEach(g=>g.remove());
  board.querySelectorAll(".hinted").forEach(g=>g.classList.remove("hinted"));
  clearTimeout(hintTimer);
}
$("hintBtn").onclick = () => {
  if (won) return;
  clearHint();
  $("msg").textContent = "考えています…";
  setTimeout(()=>{
    const path = solve(pieces.map(p=>({...p})));
    if (!path){ $("msg").textContent = "この盤面からは解けません。"; return; }
    if (!path.length) return;
    const mv = path[0], p = pieces[mv.i];
    const g = document.createElement("div"); g.className = "ghost";
    place(g, {...p, r:mv.r, c:mv.c});
    g.style.width = `calc(${p.w*25}% - 6px)`; g.style.height = `calc(${p.h*20}% - 6px)`;
    board.appendChild(g);
    $("pc-"+p.id).classList.add("hinted");
    selected = p.id; lastId = null; render();
    $("msg").textContent = `「${p.label}」を点線の位置へ。ここから最短であと${path.length}手です。`;
    hintTimer = setTimeout(clearHint, 4000);
  }, 30);
};

/* ---------- キーボード ---------- */
document.addEventListener("keydown", e=>{
  if (e.key === "Enter" && (screen === "title" || screen === "clear")){
    e.preventDefault(); goSelect(); return;
  }
  if (screen === "select" && /^Arrow/.test(e.key)){
    const cards = [...document.querySelectorAll(".card")];
    const i = cards.indexOf(document.activeElement);
    const cols = Math.max(1, Math.round($("cards").clientWidth / cards[0].offsetWidth));
    const d = {ArrowRight:1,ArrowLeft:-1,ArrowDown:cols,ArrowUp:-cols}[e.key];
    const n = Math.min(cards.length-1, Math.max(0, (i<0?0:i)+d));
    e.preventDefault(); cards[n].focus(); return;
  }
  if (screen === "game"){
    if (e.key === "Escape"){ goSelect(); return; }
    const dir = {ArrowUp:[-1,0],ArrowDown:[1,0],ArrowLeft:[0,-1],ArrowRight:[0,1]}[e.key];
    if (!dir || !selected) return;
    e.preventDefault();
    const p = pieces.find(q=>q.id===selected);
    if (p && !step(p,dir[0],dir[1])) $("msg").textContent = "その方向には動かせません。";
  }
});

/* ---------- 起動 ---------- */
const hot = window.claude?.hot;
hot?.snapshot?.(() => ({ screen, levelIdx, pos: pieces.map(p=>[p.r,p.c]), moves, won }));
const start = d => {
  if (d && d.screen === "game" && d.pos && !d.won) startLevel(d.levelIdx, d);
  else if (d && (d.screen === "select" || d.screen === "clear")){ levelIdx = d.levelIdx || 0; goSelect(); }
  else show("title");
};
hot?.ready ? hot.ready(start) : start(hot?.data ?? {});
})();
</script>

</body></html>
